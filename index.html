<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODIPEL - Catálogo & Gestão de Peças</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.95)), 
                        url('watermarked_img_354911951354233204.jpg') center/cover no-repeat fixed;
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-slate-900/90 backdrop-blur-md border border-slate-700/60 rounded-xl shadow-2xl overflow-hidden">
        
        <!-- Cabeçalho com Logo CODIPEL -->
        <div class="bg-slate-950 p-6 border-b border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <img src="CODIPEL LOGO NOVA 1000x1000.png" alt="CODIPEL" class="h-14 object-contain bg-white p-1 rounded">
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">DISTRIBUIDORA DE PEÇAS</h1>
                    <p class="text-xs text-slate-400">Sistema de Consulta e Cruzamento de Códigos</p>
                </div>
            </div>
            
            <!-- Navegação de Abas -->
            <div class="flex bg-slate-800/80 p-1 rounded-lg border border-slate-700">
                <button id="tabBusca" onclick="trocarAba('busca')" class="px-5 py-2 rounded-md font-bold text-sm bg-blue-600 text-white shadow">
                    Consultar Catálogo
                </button>
                <button id="tabCad" onclick="trocarAba('cadastro')" class="px-5 py-2 rounded-md font-bold text-sm text-slate-300 hover:text-white">
                    Cadastrar Produto / Reparos
                </button>
            </div>
        </div>

        <div class="p-6">
            <!-- ================= ABA DE CONSULTA ================= -->
            <div id="secaoBusca">
                <div class="mb-6">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        Digite qualquer código (Original, Paralelo ou Componente):
                    </label>
                    <div class="flex gap-2">
                        <input type="text" id="inputCodigo" placeholder="Ex: F000AL0309, ZM0735, ZEN31010..." 
                               class="flex-1 bg-slate-800 border border-slate-600 focus:border-red-500 text-white p-3 rounded-lg focus:outline-none text-lg">
                        <button onclick="buscar()" class="bg-red-600 hover:bg-red-700 text-white px-8 font-bold rounded-lg transition shadow-lg">
                            Buscar
                        </button>
                    </div>
                </div>

                <!-- Container de Resultados -->
                <div id="areaResultados" class="space-y-6"></div>
                <div id="msgErroBusca" class="hidden text-center p-6 bg-red-900/30 border border-red-500/50 rounded-lg text-red-300 font-medium">
                    Nenhum produto ou componente foi localizado com este código.
                </div>
            </div>

            <!-- ================= ABA DE CADASTRO ================= -->
            <div id="secaoCadastro" class="hidden">
                <form id="formCadastro" onsubmit="salvarCadastro(event)">
                    <div class="bg-slate-800/60 p-5 rounded-lg border border-slate-700 mb-6">
                        <h2 class="text-base font-bold text-red-500 uppercase tracking-wider mb-4 border-b border-slate-700 pb-2">
                            1. Produto Principal (Motor de Partida / Alternador)
                        </h2>
                        <div class="grid md:grid-cols-3 gap-4 mb-4">
                            <div>
                                <label class="block text-xs text-slate-300 mb-1">Código da Peça (Único)*</label>
                                <input type="text" id="cadCodigoPeca" required placeholder="Ex: ZEN31005" class="w-full bg-slate-900 border border-slate-600 p-2 rounded text-white">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-300 mb-1">Marca*</label>
                                <input type="text" id="cadMarca" required placeholder="Ex: ZEN, BOSCH, ZM" class="w-full bg-slate-900 border border-slate-600 p-2 rounded text-white">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-300 mb-1">Aplicação*</label>
                                <input type="text" id="cadAplicacao" required placeholder="Ex: FORD F250 CUMMINS" class="w-full bg-slate-900 border border-slate-600 p-2 rounded text-white">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">Códigos Originais / Equivalentes Cruzados (Separados por vírgula)</label>
                            <input type="text" id="cadCruzados" placeholder="Ex: 0001223505, F000AL0151, EU20571, 2C3511001BA, ZM8013006" class="w-full bg-slate-900 border border-slate-600 p-2 rounded text-white font-mono text-sm">
                        </div>
                    </div>

                    <div class="bg-slate-800/60 p-5 rounded-lg border border-slate-700 mb-6">
                        <h2 class="text-base font-bold text-blue-400 uppercase tracking-wider mb-4 border-b border-slate-700 pb-2">
                            2. Componentes / Reparos da Vista Explodida
                        </h2>
                        <div id="gridComponentes" class="grid md:grid-cols-2 gap-4">
                            <!-- Inseridos dinamicamente via JS -->
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-lg text-lg transition shadow-lg">
                        Salvar Produto e Lista de Reparos no Banco
                    </button>
                    <div id="msgStatusCad" class="hidden mt-4 p-4 rounded-lg text-center font-bold"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://codsimilar.onrender.com";

        const TIPOS_COMPONENTES = [
            "Bendix / Impulsor", "Relé Partida", "Relé Auxiliar Partida", "Suporte Escova",
            "Induzido", "Bobina", "Bobina c/ Carcaça", "Planetária", "Reparo Planetária",
            "Reparo Partida", "Reparo Parcial Partida", "Garfo", "Mancal Acionamento",
            "Mancal Intermediário", "Mancal Coletor", "Rolamento 1", "Rolamento 2",
            "Kit Bucha", "Pinhão"
        ];

        // Monta os campos de componentes no cadastro automaticamente
        function carregarCamposComponentes() {
            const grid = document.getElementById('gridComponentes');
            grid.innerHTML = TIPOS_COMPONENTES.map((tipo, index) => `
                <div class="bg-slate-900/80 p-3 rounded border border-slate-700/80 space-y-2">
                    <span class="text-xs font-bold text-slate-300 block">${tipo}</span>
                    <input type="hidden" class="comp-tipo" value="${tipo}">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" placeholder="Código Peça (Ex: ZM0735)" class="comp-codigo bg-slate-800 border border-slate-600 p-1.5 rounded text-xs text-white">
                        <input type="text" placeholder="Marca (Ex: ZM)" class="comp-marca bg-slate-800 border border-slate-600 p-1.5 rounded text-xs text-white">
                    </div>
                </div>
            `).join('');
        }
        carregarCamposComponentes();

        function trocarAba(aba) {
            document.getElementById('secaoBusca').classList.toggle('hidden', aba !== 'busca');
            document.getElementById('secaoCadastro').classList.toggle('hidden', aba !== 'cadastro');
            
            document.getElementById('tabBusca').className = aba === 'busca' 
                ? "px-5 py-2 rounded-md font-bold text-sm bg-blue-600 text-white shadow"
                : "px-5 py-2 rounded-md font-bold text-sm text-slate-300 hover:text-white";
                
            document.getElementById('tabCad').className = aba === 'cadastro' 
                ? "px-5 py-2 rounded-md font-bold text-sm bg-blue-600 text-white shadow"
                : "px-5 py-2 rounded-md font-bold text-sm text-slate-300 hover:text-white";
        }

        async function buscar(codigoEspecifico = null) {
            const termo = codigoEspecifico || document.getElementById('inputCodigo').value.trim();
            const container = document.getElementById('areaResultados');
            const msgErro = document.getElementById('msgErroBusca');

            container.innerHTML = '';
            msgErro.classList.add('hidden');

            if (!termo) return;

            try {
                const res = await fetch(`${API_URL}/api/catalogo/buscar/${encodeURIComponent(termo)}`);
                if (!res.ok) throw new Error();
                const dados = await res.json();

                dados.forEach(item => {
                    if (item.tipo_resultado === "PRODUTO_COMPLETO") {
                        const p = item.produto;
                        container.innerHTML += `
                            <div class="bg-slate-800 border-l-4 border-red-500 p-5 rounded-r-lg shadow">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <span class="text-xs font-bold text-red-400 uppercase tracking-widest">${p.marca}</span>
                                        <h3 class="text-xl font-bold text-white">${p.codigo_peca} - ${p.aplicacao}</h3>
                                    </div>
                                </div>
                                <p class="text-xs text-slate-400 mb-4 font-mono"><strong>Códigos Cruzados:</strong> ${p.codigos_cruzados || 'Nenhum'}</p>
                                
                                <h4 class="text-xs font-bold uppercase text-slate-300 mb-2 border-b border-slate-700 pb-1">Componentes / Vista Explodida:</h4>
                                <div class="grid md:grid-cols-2 gap-2">
                                    ${item.componentes.map(c => `
                                        <div class="bg-slate-900 p-2 rounded border border-slate-700 flex justify-between items-center text-sm">
                                            <span class="text-slate-400 font-medium">${c.tipo}:</span>
                                            <span class="font-mono text-blue-400 font-bold">${c.codigo_peca} (${c.marca})</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    } else if (item.tipo_resultado === "COMPONENTE_LINKADO") {
                        const c = item.componente;
                        container.innerHTML += `
                            <div class="bg-slate-800 border-l-4 border-blue-500 p-5 rounded-r-lg shadow">
                                <span class="text-xs font-bold text-blue-400 uppercase tracking-widest">Componente Encontrado</span>
                                <h3 class="text-xl font-bold text-white">${c.tipo}: ${c.codigo_peca} (${c.marca})</h3>
                                <p class="text-xs text-slate-300 mb-4">Aplica-se nos seguintes Produtos Principais:</p>
                                
                                <div class="space-y-2">
                                    ${item.aplicado_em_produtos.map(p => `
                                        <div onclick="buscar('${p.codigo_peca}')" class="bg-slate-900 hover:bg-slate-950 p-3 rounded border border-slate-700 cursor-pointer flex justify-between items-center transition">
                                            <div>
                                                <span class="font-bold text-white">${p.codigo_peca}</span> - <span class="text-xs text-slate-400">${p.aplicacao} (${p.marca})</span>
                                            </div>
                                            <span class="text-xs text-red-400 font-bold">Ver Vista Explodida →</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                });

            } catch {
                msgErro.classList.remove('hidden');
            }
        }

        async function salvarCadastro(e) {
            e.preventDefault();
            const msgStatus = document.getElementById('msgStatusCad');
            msgStatus.classList.add('hidden');

            const componentes = [];
            document.querySelectorAll('#gridComponentes > div').forEach(div => {
                const tipo = div.querySelector('.comp-tipo').value;
                const codigo_peca = div.querySelector('.comp-codigo').value.trim();
                const marca = div.querySelector('.comp-marca').value.trim();

                if (codigo_peca) {
                    componentes.push({ tipo, codigo_peca, marca, codigos_cruzados: "" });
                }
            });

            const payload = {
                codigo_peca: document.getElementById('cadCodigoPeca').value.trim(),
                marca: document.getElementById('cadMarca').value.trim(),
                aplicacao: document.getElementById('cadAplicacao').value.trim(),
                codigos_cruzados: document.getElementById('cadCruzados').value.trim(),
                componentes: componentes
            };

            try {
                const res = await fetch(`${API_URL}/api/cadastrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error();

                msgStatus.innerText = "Produto e componentes cadastrados e vinculados com sucesso!";
                msgStatus.className = "mt-4 p-4 rounded-lg text-center font-bold bg-green-900/60 text-green-300 border border-green-500/50";
                msgStatus.classList.remove('hidden');
                document.getElementById('formCadastro').reset();

            } catch {
                msgStatus.innerText = "Erro ao salvar no banco de dados.";
                msgStatus.className = "mt-4 p-4 rounded-lg text-center font-bold bg-red-900/60 text-red-300 border border-red-500/50";
                msgStatus.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
